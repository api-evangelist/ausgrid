  evidence: No OpenADR demand-response interface published.
compliance_program:
  published: false
  detail: >-
    No trust centre, no SOC 2 / ISO 27001 / PCI DSS certification page, and no
    published compliance posture for any technology surface. Ausgrid's compliance

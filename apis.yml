name: Ausgrid
kind: company
description: >-
  Ausgrid is the largest electricity distribution network service provider
  on Australia's east coast, operating the poles, wires, substations and underground
  cables that deliver power to more than 1.8 million customers across Sydney, the
  Central Coast and the Hunter Valley in New South Wales. It sits in the regulated
  middle of the value chain — between the National Electricity Market and the retailers
  who bill the customer — and it earns a regulated revenue rather than selling energy.
  Its API posture is honestly split and worth stating plainly. On the open side,
  Ausgrid publishes genuinely open network data: twenty years (2005–2025) of 15-minute
  interval demand readings for more than 180 zone substations as freely downloadable
  zipped CSV, plus average electricity use and past outage datasets catalogued on
  the NSW Government CKAN portal under CC-BY, none of which require a login, key or
  agreement. On the consumer side it is closed: a customer's own interval meter data
  is obtained through a web form that verifies NMI, account name and postcode and
  is answered in 10 to 20 business days, with a signed consent form required for any
  third party — there is no consumer API. Australia's Consumer Data Right was extended
  to energy and is live, but the designation lands on electricity retailers as primary
  data holders with AEMO as the gateway; Ausgrid is a distributor and does not appear
  among the 84 energy brands in the public CDR Register, so the mandate proven in
  banking routes around the business that physically holds the meter. Ausgrid publishes
  no developer portal, no OpenAPI, and no documented API of any kind; the only
  machine-readable surfaces found are the undocumented internal JSON routes behind
  its own outage map.

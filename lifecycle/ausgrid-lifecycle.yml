applies_to: published data products (Ausgrid operates no API)
versioning:
  scheme: annual-dataset-vintage
  current: FY2025 interval data file; DTAPR 2023 feature layer
  detail: >-
    There is no API and therefore no API version. Data vintage is the version:
    zone substation interval demand ships one ZIP per financial year (2005 through
    2025), and the ArcGIS layers carry the vintage in the service name
    (Ausgrid_DTAPR_2023) and in per-record fields (dataset, extract_date —
    "October 2023" on the DTAPR layer, "20240627" on the hosting capacity layer).
release_cadence:
  scheme: annual
  rule: National Electricity Rules 5.13A
  detail: >-
    Ausgrid states it provides 12 months of interval data in .csv within 30 business
    days of publishing its Distribution and Transmission Annual Planning Report, for a
    Reporting Year (as defined in Rule 5.13A) running May to May. The FY2025 file is
    marked updated 2025-12-09.
deprecation:
  policy_url: null
  sunset_header: false
  detail: >-
    No deprecation or sunset policy of any kind. The failure mode is visible and
    unmanaged: Ausgrid restructured its website from /Industry/Our-Research/Data-to-share/
    to /about-us/about-ausgrid/research-data-sets/ without redirects, so all three
    resource links in the NSW Government CKAN catalogue now 404, and the long-cited
